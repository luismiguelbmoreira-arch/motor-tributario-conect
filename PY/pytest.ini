[pytest]
# Motor Tributário Conect — Configuração de testes
# Rodar: python -m pytest tests/ -v

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Cobertura padrão ao rodar pytest diretamente
addopts =
    --tb=short
    --strict-markers
    -q

# Marcadores customizados
markers =
    slow: testes lentos (extração PDF, integração)
    guard: testes de Guard Clause — falha bloqueia deploy
    fiscal: testes de regras tributárias fiscais
