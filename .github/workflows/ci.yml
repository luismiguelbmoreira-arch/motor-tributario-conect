name: CI — Motor Tributário Conect

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Testes Automatizados (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: PY

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: PY/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # weasyprint requer libpango no CI — instalado separado
          pip install -r requirements.txt --no-deps weasyprint || true
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Instalar dependências do sistema (weasyprint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Criar .env de teste
        run: |
          echo "JWT_SECRET_KEY=ci_test_secret_key_nao_usar_em_producao" > .env
          echo "DATABASE_URL=sqlite:///test_motor.db" >> .env
          echo "ANTHROPIC_API_KEY=sk-ant-test-placeholder" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Rodar testes com cobertura
        run: |
          python -m pytest tests/ -v \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -x

      - name: Cobertura por módulo — motor_tributario.py (≥85%)
        run: |
          coverage report \
            --include="core/motor_tributario.py" \
            --fail-under=85 \
            --show-missing
        working-directory: PY

      - name: Cobertura por módulo — regimes/ (≥90%)
        run: |
          coverage report \
            --include="core/regimes/*.py" \
            --fail-under=90 \
            --show-missing
        working-directory: PY

      - name: Upload cobertura para Codecov (opcional)
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          file: PY/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: Lint — Qualidade de Código
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PY

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas de lint
        run: pip install ruff

      - name: Ruff — verificar estilo e erros
        run: |
          ruff check . \
            --select E,W,F,I \
            --ignore E501 \
            --exclude tests/ \
            --exclude alembic/

  security:
    name: Segurança — Scan de Dependências
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PY

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Auditar vulnerabilidades em dependências
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969
        continue-on-error: false
