# Dependabot — monitoramento continuo de vulnerabilidades
# Abre PRs automaticamente quando dependencias pip ou GitHub Actions tem update de seguranca
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Python (pip)
  - package-ecosystem: "pip"
    directory: "/PY"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps):"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci):"
