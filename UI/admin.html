<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração — Motor Conect</title>
  
  <!-- CSS Centralizado -->
  <link rel="stylesheet" href="design_system.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Estilos específicos para a tabela administrativa */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    
    .admin-table th {
      text-align: left;
      padding: 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    
    .admin-table td {
      padding: 1rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .admin-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-active { background: rgba(0, 179, 126, 0.1); color: var(--color-green-500); }
    .status-inactive { background: rgba(226, 88, 88, 0.1); color: var(--color-red-500); }

    /* Toasts */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 1000;
    }
    
    .toast {
      background: var(--color-gray-900);
      border: 1px solid var(--border-subtle);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-top: 0.5rem;
      animation: fadeSlideUp 0.3s ease-out;
    }
  </style>
</head>

<body>
  <div class="app-container">
    
    <!-- Sidebar Shell (consistência visual) -->
    <aside style="width: 280px; height: 100vh; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(20px); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; position: sticky; top: 0;">
      <div class="p-6 mb-8 flex-row items-center gap-3">
        <div style="width: 32px; height: 32px; background: var(--action-primary); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <i data-lucide="zap" style="color: white; width: 18px; height: 18px;"></i>
        </div>
        <h1 style="font-size: 1.1rem; font-weight: 700;">Motor Conect</h1>
      </div>
      <nav style="flex: 1;">
        <a href="dashboard.html" style="display: flex; align-items: center; gap: 1rem; padding: 0.875rem 1.25rem; color: var(--text-secondary); text-decoration: none; border-radius: 10px; margin: 0.25rem 1rem;">
          <i data-lucide="layout-grid" style="width: 18px;"></i> Dashboard
        </a>
        <a href="analise_unificada.html" style="display: flex; align-items: center; gap: 1rem; padding: 0.875rem 1.25rem; color: var(--text-secondary); text-decoration: none; border-radius: 10px; margin: 0.25rem 1rem;">
          <i data-lucide="file-text" style="width: 18px;"></i> Nova Auditoria
        </a>
        <div class="mt-8 px-8 mb-2">
          <p class="text-muted" style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase;">Gestão</p>
        </div>
        <a href="admin.html" style="display: flex; align-items: center; gap: 1rem; padding: 0.875rem 1.25rem; color: var(--color-green-500); background: rgba(0, 179, 126, 0.1); border: 1px solid rgba(0, 179, 126, 0.2); text-decoration: none; border-radius: 10px; margin: 0.25rem 1rem; font-weight: 600;">
          <i data-lucide="users" style="width: 18px;"></i> Usuários
        </a>
      </nav>
    </aside>

    <main class="main-content">
      
      <!-- Header -->
      <header class="flex-row justify-between items-center mb-10">
        <div>
          <h2 class="text-h1">Gestão de Usuários</h2>
          <p class="text-body text-muted">Controle de acesso e segurança da plataforma.</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('modalCriar')">
          <i data-lucide="plus"></i> Novo Usuário
        </button>
      </header>

      <!-- Stats Grid -->
      <div class="flex-row gap-6 mb-8">
        <div class="glass-card flex-1" style="padding: 1.25rem;">
          <p class="text-muted" style="font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">Total</p>
          <h4 class="text-h1" id="stat-total" style="font-size: 1.5rem;">--</h4>
        </div>
        <div class="glass-card flex-1" style="padding: 1.25rem;">
          <p class="text-muted" style="font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">Ativos</p>
          <h4 class="text-h1 text-success" id="stat-ativos" style="font-size: 1.5rem;">--</h4>
        </div>
        <div class="glass-card flex-1" style="padding: 1.25rem;">
          <p class="text-muted" style="font-size: 0.75rem; text-transform: uppercase; font-weight: 600;">Admins</p>
          <h4 class="text-h1" id="stat-admins" style="font-size: 1.5rem; color: var(--color-blue-500);">--</h4>
        </div>
      </div>

      <!-- Tabela -->
      <div class="glass-card" style="padding: 0;">
        <div id="table-loading" class="p-20 text-center">
          <div class="spinner mx-auto mb-4"></div>
          <p class="text-muted">Carregando usuários...</p>
        </div>

        <div id="table-wrap" class="step-hidden">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Usuário / E-mail</th>
                <th>Perfil</th>
                <th>Status</th>
                <th>Último Acesso</th>
                <th style="text-align: right;">Ações</th>
              </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Modais -->
  <!-- Criar Usuário -->
  <div id="modalCriar" class="step-hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100;">
    <div class="glass-card" style="max-width: 450px; width: 100%;">
      <h3 class="text-h2 mb-6">Novo Usuário</h3>
      <div class="flex-col gap-4">
        <div class="input-group">
          <label class="input-label">Nome de Usuário</label>
          <input type="text" id="new-username" class="input-field" placeholder="ex: joao.silva">
        </div>
        <div class="input-group">
          <label class="input-label">E-mail</label>
          <input type="email" id="new-email" class="input-field" placeholder="email@exemplo.com">
        </div>
        <div class="input-group">
          <label class="input-label">Perfil</label>
          <select id="new-role" class="input-field">
            <option value="usuario">Analista</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="input-group">
          <label class="input-label">Senha Temporária</label>
          <input type="password" id="new-password" class="input-field" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="flex-row justify-end gap-3 mt-6">
          <button class="btn btn-ghost" onclick="closeModal('modalCriar')">Cancelar</button>
          <button class="btn btn-primary" onclick="criarUsuario()">Criar Acesso</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script>
    lucide.createIcons();

    const API_BASE = window.location.origin;
    const token = sessionStorage.getItem('token');

    async function loadUsers() {
      try {
        const res = await fetch(`${API_BASE}/admin/usuarios`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const users = await res.json();
        
        document.getElementById('table-loading').classList.add('step-hidden');
        document.getElementById('table-wrap').classList.remove('step-hidden');

        // Stats
        document.getElementById('stat-total').innerText = users.length;
        document.getElementById('stat-ativos').innerText = users.filter(u => u.ativo).length;
        document.getElementById('stat-admins').innerText = users.filter(u => u.role === 'admin').length;

        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>
              <div class="flex-col">
                <span style="font-weight: 600;">${u.username}</span>
                <span class="text-muted" style="font-size: 0.75rem;">${u.email || ''}</span>
              </div>
            </td>
            <td>
              <span class="text-muted" style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em;">${u.role}</span>
            </td>
            <td>
              <span class="status-badge ${u.ativo ? 'status-active' : 'status-inactive'}">
                ${u.ativo ? 'Ativo' : 'Inativo'}
              </span>
            </td>
            <td>
              <span class="text-muted" style="font-size: 0.75rem;">${u.ultimo_acesso ? new Date(u.ultimo_acesso).toLocaleDateString() : 'Nunca'}</span>
            </td>
            <td style="text-align: right;">
              <button class="btn btn-ghost" style="padding: 0.4rem;" title="Resetar Senha" onclick="resetSenha(${u.id})">
                <i data-lucide="key" style="width: 14px;"></i>
              </button>
              <button class="btn btn-ghost" style="padding: 0.4rem; color: var(--color-red-500);" title="Desativar" onclick="desativarUsuario(${u.id})">
                <i data-lucide="user-minus" style="width: 14px;"></i>
              </button>
            </td>
          </tr>
        `).join('');
        lucide.createIcons();
      } catch (err) {
        showToast('Erro ao carregar usuários', 'error');
      }
    }

    function openModal(id) { document.getElementById(id).classList.replace('step-hidden', 'step-visible'); }
    function closeModal(id) { document.getElementById(id).classList.replace('step-visible', 'step-hidden'); }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // Call init
    loadUsers();
  </script>
</body>
</html>
