<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conect — Motor Tributário 2026-2033</title>
  
  <!-- CSS Centralizado (Design System) -->
  <link rel="stylesheet" href="design_system.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="justify-center items-center">

  <!-- Background Decorativo -->
  <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: var(--color-black);">
    <div style="position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 179, 126, 0.08) 0%, transparent 70%); top: -200px; left: -200px;"></div>
    <div style="position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(10, 132, 255, 0.05) 0%, transparent 70%); bottom: -100px; right: -100px;"></div>
  </div>

  <div class="animate-fade-slide-up" style="max-width: 420px; width: 100%; padding: 1rem;">
    <!-- Logo -->
    <div class="flex-col items-center gap-4 mb-6 text-center">
      <div style="width: 48px; height: 48px; background: var(--action-primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px rgba(0, 179, 126, 0.3);">
        <i data-lucide="shield-check" style="color: white; width: 28px; height: 28px;"></i>
      </div>
      <div>
        <h2 class="text-h2">Conect Motor</h2>
        <p class="text-muted" style="letter-spacing: 0.1em; text-transform: uppercase;">Inteligência Fiscal 2026</p>
      </div>
    </div>

    <!-- Login Card -->
    <div class="glass-card">
      <div class="mb-6">
        <h3 class="text-h2" style="font-size: 1.25rem;">Boas-vindas</h3>
        <p class="text-body">Acesse a plataforma de auditoria.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <label class="input-label" for="username">Usuário</label>
          <div style="position: relative;">
            <i data-lucide="user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 16px; color: var(--text-secondary);"></i>
            <input type="text" id="username" class="input-field" placeholder="Administrador" style="padding-left: 3rem;" required>
          </div>
        </div>

        <div class="input-group">
          <div class="flex-row justify-between w-full">
            <label class="input-label" for="password">Senha</label>
            <a href="#" class="text-muted" style="text-decoration: none;" onclick="showRecoveryModal()">Esqueceu?</a>
          </div>
          <div style="position: relative;">
            <i data-lucide="lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 16px; color: var(--text-secondary);"></i>
            <input type="password" id="password" class="input-field" placeholder="••••••••" style="padding-left: 3rem;" required>
            <button type="button" id="togglePassword" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary);">
              <i data-lucide="eye" id="eyeIcon" style="width: 16px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-full mt-4">
          <span id="btnText">Entrar no Sistema</span>
        </button>

        <div id="generalError" class="step-hidden mt-4 p-4 text-danger text-center" style="background: rgba(226, 88, 88, 0.1); border-radius: 8px; border: 1px solid rgba(226, 88, 88, 0.2); font-size: 0.8rem;">
          Credenciais inválidas. Tente novamente.
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="mt-6 text-center">
      <p class="text-muted">
        <i data-lucide="shield" style="width: 12px; vertical-align: middle; margin-right: 4px;"></i>
        Protegido por LGPD &bull; v2.0
      </p>
    </div>
  </div>

  <!-- Modal Recuperação -->
  <div id="modalRecovery" class="step-hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1.5rem;">
    <div class="glass-card" style="max-width: 400px; width: 100%;">
      <div class="flex-row gap-4 mb-4">
        <div style="width: 40px; height: 40px; background: rgba(10, 132, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
          <i data-lucide="info" style="color: var(--color-blue-500);"></i>
        </div>
        <h3 class="text-h2" style="font-size: 1.1rem;">Recuperação</h3>
      </div>
      <p class="text-body mb-6">Entre em contato com o suporte do escritório para resetar suas credenciais no painel administrativo.</p>
      <button class="btn btn-ghost w-full" onclick="hideRecoveryModal()">Fechar</button>
    </div>
  </div>

  <script>
    // Inicializar ícones Lucide
    lucide.createIcons();

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const generalError = document.getElementById('generalError');
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    // Toggle Senha
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordField.type === 'password';
      passwordField.type = isPassword ? 'text' : 'password';
      eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    // Modais
    function showRecoveryModal() { document.getElementById('modalRecovery').classList.replace('step-hidden', 'step-visible'); }
    function hideRecoveryModal() { document.getElementById('modalRecovery').classList.replace('step-visible', 'step-hidden'); }

    // Logic Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      generalError.classList.add('step-hidden');
      
      const username = document.getElementById('username').value;
      const password = passwordField.value;

      if (!username || !password) return;

      submitBtn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div> Autenticando...';

      try {
        const res = await fetch(`${window.location.origin}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          const data = await res.json();
          sessionStorage.setItem('token', data.access_token);
          window.location.href = 'dashboard.html';
        } else {
          generalError.classList.remove('step-hidden');
        }
      } catch (err) {
        generalError.innerText = 'Erro de conexão com o servidor.';
        generalError.classList.remove('step-hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = 'Entrar no Sistema';
      }
    });
  </script>
</body>
</html>
