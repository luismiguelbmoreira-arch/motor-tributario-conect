<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor Conect — Configurações</title>
  <link rel="stylesheet" href="design_system.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar injetada automaticamente pelo components.js -->

    <main class="main-content">
      <header class="mb-8 border-b pb-4" style="border-color: var(--border-subtle);">
        <h2 class="text-h1">Configurações Base</h2>
        <p class="text-body mt-2">Parâmetros operacionais do Motor Tributário e configurações de perfil de usuário.</p>
      </header>

      <div class="glass-card" style="max-width: 600px;">
        <div class="flex-col gap-6">
          <div class="flex-col gap-2">
            <label class="input-label" style="font-weight: 600;">Tema do Design System</label>
            <select class="input-field" title="Tema visual do painel">
              <option>Escuro (Padrão)</option>
              <option>Claro</option>
              <option>Automático</option>
            </select>
          </div>
          
          <div class="flex-col gap-2">
            <label class="input-label" style="font-weight: 600;">Notificações de Falha (Extração e-CAC)</label>
            <select class="input-field" title="Recebimento de alertas de erro de IA">
              <option>Alertar apenas no Painel</option>
              <option>Enviar e-mail para Administradores</option>
              <option>Desativado</option>
            </select>
          </div>

          <div class="flex-col gap-2">
            <label class="input-label" style="font-weight: 600;">Retenção de Documentos (Soft Delete)</label>
            <select class="input-field" title="Política de limpeza de PDFs e XMLs processados">
              <option>Manter em disco rígido indefinidamente</option>
              <option>Mover para .lixeira após 30 dias</option>
              <option>Mover para .lixeira após 7 dias</option>
            </select>
            <p class="text-muted" style="font-size: 0.7rem;">Conformidade com LGPD Art. 16 (eliminação após finalidade) e CTN Art. 173 (retenção mínima 5 anos).</p>
          </div>

          <div class="flex-col gap-2">
            <label class="input-label" style="font-weight: 600;">Layout de Laudo Padrão</label>
            <select class="input-field" title="Exportação de relatórios">
              <option>Layout Executivo (Diferencial Fiscal e Resumo de Tributação)</option>
              <option>Layout Contador (Matriz Analítica e Trilha de Auditoria)</option>
              <option>Layout Fiscal (Conformidade Estrita — Padrão RFB)</option>
            </select>
          </div>

          <div class="flex-col gap-2">
            <label class="input-label" style="font-weight: 600;">Fuso Horário dos Logs</label>
            <select class="input-field" title="Fuso horário dos relatórios">
              <option>America/Sao_Paulo (UTC -03:00)</option>
              <option>America/Manaus (UTC -04:00)</option>
              <option>UTC (GTS)</option>
            </select>
          </div>

          <div class="flex-row justify-end mt-4">
            <button class="btn btn-primary"><i data-lucide="save" style="width: 18px; margin-right: 0.5rem;"></i> Salvar Modificações</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="components.js"></script>
</body>
</html>
